<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeLift 360 — Certificate Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <style>
        body {
            background-color: #0b1020;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .verify-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .verify-card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .verify-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .verify-badge {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .verify-title {
            font-size: 22px;
            font-weight: 800;
            color: #f8fafc;
            margin: 0;
        }

        .verify-sub {
            font-size: 13px;
            color: #94a3b8;
            margin: 2px 0 0;
        }

        .search-group {
            display: flex;
            gap: 10px;
        }

        .search-group input {
            flex: 1;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px 16px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            text-transform: uppercase;
        }

        .search-group input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .btn-verify {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-verify:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.4);
        }

        /* Result Details Card */
        .result-container {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .status-valid {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.18);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            width: fit-content;
        }

        .status-invalid {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.18);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            width: fit-content;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 16px;
            font-size: 13px;
        }

        .result-item span {
            display: block;
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .result-item strong {
            color: #f8fafc;
            font-size: 14px;
        }

        .nav-home-link {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            text-decoration: none;
            margin-top: 8px;
        }

        .nav-home-link:hover {
            color: #10b981;
        }
    </style>
</head>
<body>
    <div class="background-backdrop"></div>

    <div class="verify-wrapper">
        <div class="verify-card">
            <div class="verify-brand">
                <div class="verify-badge">🔍</div>
                <div>
                    <h1 class="verify-title">Certificate Verification</h1>
                    <p class="verify-sub">SafeLift 360 Official Credential Verification System</p>
                </div>
            </div>

            <form id="verifyForm" class="search-group">
                <input type="text" id="certInput" placeholder="Enter Certificate No. (e.g. SL360-2026-000001)" required>
                <button type="submit" class="btn-verify">Verify</button>
            </form>

            <div id="resultContainer" class="result-container">
                <!-- Dynamic result contents -->
            </div>
        </div>

        <a href="login.html" class="nav-home-link">← Return to SafeLift 360 Login Portal</a>
    </div>

    <script src="verify.js"></script>
</body>
</html>
