<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SafeLift 360 - Workplace Manual Handling Safety Training Portal Login">
    <title>SafeLift 360 — Sign In</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Login Page Stylesheet -->
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <!-- Background overlay elements -->
    <div class="background-backdrop" aria-hidden="true"></div>
    <div class="ambient-glow glow-1" aria-hidden="true"></div>
    <div class="ambient-glow glow-2" aria-hidden="true"></div>

    <main class="login-wrapper">
        <div class="login-card">

            <!-- Top Safety Badge -->
            <div class="card-badge">
                <span class="pulse-dot" aria-hidden="true"></span>
                <span>TRAINING PORTAL</span>
            </div>

            <!-- Brand Header -->
            <header class="brand-header">
                <div class="brand-logo">
                    <span class="logo-icon" aria-hidden="true">🏗️</span>
                    <h1 class="brand-name">SAFE LIFT 360</h1>
                </div>
                <p class="brand-subtitle">Workplace Manual Handling Safety Training</p>
            </header>

            <!-- Card Divider -->
            <div class="divider" aria-hidden="true"></div>

            <!-- Welcome Title -->
            <div class="welcome-section">
                <h2 class="welcome-title">Welcome Back</h2>
                <p class="welcome-text">Sign in to continue your training.</p>
            </div>

            <!-- Dynamic Alert / Notice Box -->
            <div id="statusAlert" class="status-alert" role="status" aria-live="polite" style="display: none;">
                <span class="alert-icon" id="alertIcon" aria-hidden="true">ℹ️</span>
                <span class="alert-text" id="alertText"></span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form" novalidate>

                <!-- Email Input Group -->
                <div class="input-group" id="emailGroup">
                    <label for="emailInput" class="input-label">Email Address</label>
                    <div class="input-control">
                        <span class="control-icon" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                            </svg>
                        </span>
                        <input
                            type="email"
                            id="emailInput"
                            name="email"
                            class="text-input"
                            placeholder="operator@workplace.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                    <span class="field-error" id="emailError" aria-live="polite"></span>
                </div>

                <!-- Password Input Group -->
                <div class="input-group" id="passwordGroup">
                    <div class="label-row">
                        <label for="passwordInput" class="input-label">Password</label>
                        <button type="button" class="forgot-link" id="forgotPasswordBtn">Forgot your password?</button>
                    </div>
                    <div class="input-control">
                        <span class="control-icon" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input
                            type="password"
                            id="passwordInput"
                            name="password"
                            class="text-input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <!-- Show / Hide Password Toggle -->
                        <button
                            type="button"
                            id="togglePasswordBtn"
                            class="password-toggle"
                            aria-label="Show password"
                            title="Show / Hide Password"
                        >
                            <svg id="eyeIcon" class="toggle-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg id="eyeOffIcon" class="toggle-svg hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                                <line x1="2" y1="2" x2="22" y2="22"></line>
                            </svg>
                        </button>
                    </div>
                    <span class="field-error" id="passwordError" aria-live="polite"></span>
                </div>

                <!-- Primary Sign In Button -->
                <button type="submit" id="signInBtn" class="btn-primary">
                    <span>Sign In</span>
                    <span class="btn-arrow" aria-hidden="true">→</span>
                </button>

            </form>

            <!-- Registration Footer -->
            <footer class="card-footer">
                <p class="signup-prompt">
                    Want to use SafeLift 360 for your organization?
                    <a href="register.html" class="signup-link" id="createAccountLink">Register Your Company</a>
                </p>
            </footer>

        </div>

        <!-- Copyright / Compliance Footnote -->
        <aside class="compliance-note">
            <span>🛡️ SafeLift 360 Workplace Safety Standards</span>
            <span class="dot">•</span>
            <span>OSHA & ISO Manual Handling Compliant</span>
        </aside>
    </main>

    <!-- Login Page Logic -->
    <script src="login.js"></script>
</body>

</html>
